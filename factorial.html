<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Factorial</title>
</head>
<body>

    <h2>Calcular factorial</h2>

    <label>Ingresa un número:</label>
    <input type="number" id="numero"><br><br>

    <button onclick="calcularFactorial()">Calcular</button>

    <h3 id="resultado"></h3>

    <script>
        function calcularFactorial() {
            let n = parseInt(document.getElementById("numero").value);
            if (n < 0) {
                document.getElementById("resultado").innerHTML = "No existe factorial para negativos";
                return;
            }
            let factorial = 1;
            for (let i = 1; i <= n; i++) {
                factorial *= i;
            }
            document.getElementById("resultado").innerHTML = "Factorial: " + factorial;
        }
    </script>

</body>
</html>
